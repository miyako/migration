<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A quick directory of 4D migration changes, with concise multilingual summaries and original source links.">
  <title>4D Migration Atlas</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">4D</span><strong data-i18n="appTitle">Migration Atlas</strong></div>
    <div class="preferences">
      <label><span data-i18n="language">Language</span><select id="language"><option value="en" lang="en">English</option><option value="fr" lang="fr">Français</option><option value="de" lang="de">Deutsch</option><option value="es" lang="es">Español</option><option value="ja" lang="ja">日本語</option></select></label>
      <label><span data-i18n="theme">Appearance</span><select id="theme"><option value="system" data-i18n="system">System</option><option value="light" data-i18n="light">Light</option><option value="dark" data-i18n="dark">Dark</option></select></label>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <h1 data-i18n="directoryTitle">Find your migration changes</h1>
    <form id="filters" role="search" data-i18n-aria="filters" aria-label="Filters">
      <fieldset class="version-selectors">
        <legend data-i18n="versions">Versions</legend>
        <div class="version-control">
          <svg id="source-icon" class="version-icon" aria-hidden="true" viewBox="0 0 1024 1024"><use href="./4d.svg#version-mark"></use></svg>
          <label><span data-i18n="sourceVersion">From version</span><select id="source-version"></select></label>
        </div>
        <span class="version-direction" role="img" data-i18n-aria="versionDirection" aria-label="From current version to target version">→</span>
        <div class="version-control">
          <svg id="target-icon" class="version-icon" aria-hidden="true" viewBox="0 0 1024 1024"><use href="./4d.svg#version-mark"></use></svg>
          <label><span data-i18n="targetVersion">To version</span><select id="target-version"></select></label>
        </div>
      </fieldset>
      <p id="version-warning" class="warning" hidden data-i18n="versionWarning">Choose a later target to see new changes. Existing deprecations and changes with unknown versions remain visible.</p>
      <section class="toolbar" aria-labelledby="filters-heading">
        <h2 id="filters-heading" data-i18n="filters">Filters</h2>
        <label class="search-field"><span data-i18n="search">Keyword or exact identifier</span><input id="search" type="search" maxlength="1000" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="Command, identifier, or keyword"></label>
        <div class="meaning-search">
          <p id="meaning-notice" class="muted"></p>
          <p id="meaning-status" class="muted" role="status" aria-live="polite"></p>
          <progress id="meaning-progress" max="100" aria-label="Loading semantic search" hidden></progress>
          <button id="meaning-retry" type="button" class="secondary" hidden></button>
        </div>
        <fieldset id="platform" class="filter-group">
          <legend data-i18n="platform">Platform</legend>
          <div class="filter-actions"><button type="button" class="secondary" data-group="platforms" data-select="all" data-i18n="selectAll" data-i18n-aria="selectPlatforms">Select all</button><button type="button" class="secondary" data-group="platforms" data-select="none" data-i18n="unselectAll" data-i18n-aria="unselectPlatforms">Unselect all</button></div>
          <div id="platform-options" class="checkbox-options"></div>
        </fieldset>
        <fieldset id="module" class="filter-group">
          <legend data-i18n="topics">Topics</legend>
          <div class="filter-actions"><button type="button" class="secondary" data-group="modules" data-select="all" data-i18n="selectAll" data-i18n-aria="selectTopics">Select all</button><button type="button" class="secondary" data-group="modules" data-select="none" data-i18n="unselectAll" data-i18n-aria="unselectTopics">Unselect all</button></div>
          <div id="module-options" class="checkbox-options"></div>
        </fieldset>
        <label class="sort-field"><span data-i18n="sort">Sort</span><select id="sort" aria-describedby="sort-hint"><option value="severity" data-i18n="criticality">Severity</option><option value="complexity" data-i18n="complexity">Complexity</option></select></label>
        <p id="sort-hint" class="muted"></p>
        <button id="reset" type="button" class="secondary" data-i18n="reset">Reset filters</button>
      </section>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="changes-heading">
      <div class="section-heading"><h2 id="changes-heading" data-i18n="changes">Changes</h2><span id="result-count" role="status" aria-live="polite"></span></div>
      <div id="change-list" class="card-list"></div>
    </section>
  </main>
  <noscript>This catalogue requires JavaScript. / Ce catalogue nécessite JavaScript. / JavaScript ist erforderlich. / Se requiere JavaScript. / JavaScript が必要です。</noscript>
</body>
</html>
